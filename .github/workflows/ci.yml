name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build and every test on each target's native runner. Linux runs the SWT
  # tests under Xvfb; Windows and macOS run them on the runner desktop.
  test:
    name: test ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x86_64, runner: ubuntu-24.04 }
          - { target: linux-aarch64, runner: ubuntu-24.04-arm }
          - { target: windows-x86_64, runner: windows-2025 }
          - { target: windows-aarch64, runner: windows-11-arm, jdk: "21.0.12.1+1" }
          - { target: macos-x86_64, runner: macos-15-intel }
          - { target: macos-aarch64, runner: macos-15 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk || '21.0.13.1+2' }}
          cache: maven
      - name: Xvfb and GTK 3
        if: runner.os == 'Linux'
        run: .github/scripts/linux-display-deps.sh
      # The WebKitGTK SWT's Browser loads on GTK 3, so the Browser preview tests run.
      - name: WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0
      - name: Verify (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x1024x24" ./mvnw -B verify
      - name: Verify (macOS)
        if: runner.os == 'macOS'
        run: ./mvnw -B verify
      - name: Verify (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: mvnw.cmd -B verify
      # Screen captures a failing SWT test leaves in target/diagnostics.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: diagnostics-${{ matrix.target }}
          path: "**/target/diagnostics/"
          if-no-files-found: ignore
          retention-days: 14

  # The SWT tests on the experimental GTK 4 backend. Gating: a test that hits a known SWT GTK 4
  # defect is skipped there with the SWT issue named.
  test-gtk4:
    name: test linux-x86_64 GTK 4 (experimental)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SWT_GTK4: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21.0.13.1+2"
          cache: maven
          # Only the full verify jobs save the Maven cache; a partial build would
          # save one without SpotBugs under the shared key.
          cache-read-only: true
      - name: Xvfb and GTK 3
        run: .github/scripts/linux-display-deps.sh
      - name: GTK 4
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-1
      - name: Verify the SWT modules
        run: xvfb-run -a -s "-screen 0 1280x1024x24" ./mvnw -B verify -pl qcaret-ui-swt,qcaret-launcher -am

  # IBusCompositionTest in its required mode: a real IBus engine through GTK 3, where any skip
  # fails. Not gating, and outside release's needs, until it has a measured pass rate.
  test-ibus:
    name: test linux-x86_64 IBus (experimental)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21.0.13.1+2"
          cache: maven
          cache-read-only: true
      - name: Xvfb and GTK 3
        run: .github/scripts/linux-display-deps.sh
      - name: IBus
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dbus ibus ibus-gtk3 ibus-table ibus-table-cangjie5 xdotool
      - name: Verify with IBus required
        run: >-
          xvfb-run -a -s "-screen 0 1280x1024x24" ./mvnw -B verify -pl qcaret-ui-swt -am
          -Dtest=IBusCompositionTest -Dsurefire.failIfNoSpecifiedTests=false
          -Dqcaret.ibus.required=true
      # A tag filter could drop the class and leave the step green.
      - name: The class ran
        run: test -f qcaret-ui-swt/target/surefire-reports/TEST-io.github.ajdailey.qcaret.ui.swt.IBusCompositionTest.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: diagnostics-ibus
          path: qcaret-ui-swt/target/diagnostics/ibus/
          if-no-files-found: ignore
          retention-days: 14

  # The seven archives and the SBOM; qcaret-dist builds the archives on
  # x86-64 Linux only.
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21.0.13.1+2"
          cache: maven
          cache-read-only: true
      # JDK archives and rcodesign, outside the Maven cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/qcaret-build
          key: qcaret-build-${{ hashFiles('qcaret-dist/src/build/dist.xml') }}
      # A v* tag builds the tag's version; anything else <revision>+<short commit>.
      # sed reads <revision> from pom.xml; a Maven call would first download
      # from Central.
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            revision="${GITHUB_REF_NAME#v}"
          else
            revision=$(sed -n 's|.*<revision>\(.*\)</revision>.*|\1|p' pom.xml)
            if [ -z "$revision" ]; then
              echo "::error::No <revision> in pom.xml"
              exit 1
            fi
            revision="$revision+${GITHUB_SHA:0:7}"
          fi
          echo "REVISION=$revision" | tee -a "$GITHUB_ENV"
      - run: >-
          ./mvnw -B package -Pall-targets,sbom -DskipTests org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
          "-Drevision=$REVISION"
      - name: SBOM runtime and launcher components
        run: .github/scripts/sbom-components.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qcaret-archives
          path: dist/
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 14 }}

  # Each bundle on its own target: the runtime reports the target's os.arch,
  # and the bundle's launcher opens the main window with that runtime. The
  # universal zip, which has no runtime, then starts with setup-java's JDK.
  bundle:
    name: bundle ${{ matrix.target }}
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x86_64, runner: ubuntu-24.04, arch: amd64 }
          - { target: linux-aarch64, runner: ubuntu-24.04-arm, arch: aarch64 }
          - { target: windows-x86_64, runner: windows-2025, arch: amd64, machine: x64 }
          - { target: windows-aarch64, runner: windows-11-arm, arch: aarch64, machine: ARM64, jdk: "21.0.12.1+1" }
          - { target: macos-x86_64, runner: macos-15-intel, arch: x86_64 }
          - { target: macos-aarch64, runner: macos-15, arch: aarch64 }
    env:
      TARGET: ${{ matrix.target }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      EXPECTED_MACHINE: ${{ matrix.machine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qcaret-archives
          path: dist
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk || '21.0.13.1+2' }}
      - name: Xvfb and GTK 3
        if: runner.os == 'Linux'
        run: .github/scripts/linux-display-deps.sh
      - name: Run the bundle (Linux, macOS)
        if: runner.os != 'Windows'
        run: .github/scripts/check-bundle.sh
      - name: Run the bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/check-bundle.ps1

  # A v* tag: check the tag against the POM revision, rebuild twice to check
  # reproducibility, check that the rebuild matches the archives the bundle
  # jobs ran, and attach those archives, SHA256SUMS and the SBOM to a draft
  # GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, test-gtk4, bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21.0.13.1+2"
          cache: maven
          cache-read-only: true
      # The package job built the tag's version; the tag must name the
      # commit's <revision>, with or without -SNAPSHOT.
      - name: Tag matches the POM revision
        run: |
          revision=$(sed -n 's|.*<revision>\(.*\)</revision>.*|\1|p' pom.xml)
          if [ -z "$revision" ]; then
            echo "::error::No <revision> in pom.xml"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v${revision%-SNAPSHOT}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the POM revision $revision"
            exit 1
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/qcaret-build
          key: qcaret-build-${{ hashFiles('qcaret-dist/src/build/dist.xml') }}
      - name: Reproducibility
        run: .github/scripts/check-reproducible.sh "-Drevision=${GITHUB_REF_NAME#v}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qcaret-archives
          path: release
      - name: SHA256SUMS
        run: |
          cd release
          sha256sum -- *.zip *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 7
          cd ../dist/reproducible/dist1
          sha256sum -c ../../../release/SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag with a suffix (v0.2.0-rc1) drafts a pre-release, so it never
        # becomes the latest release.
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes "${prerelease[@]}"

  # A push to main: replace the continuous pre-release with this run's
  # archives, SHA256SUMS and SBOM (publish-continuous.sh). One publish runs at
  # a time; the script skips a commit older than the one published.
  continuous:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, test-gtk4, bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: continuous
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qcaret-archives
          path: release
      - name: SHA256SUMS
        run: |
          cd release
          sha256sum -- *.zip *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 7
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-continuous.sh
