version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    # One weekly pull request for every Maven update.
    groups:
      maven:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    # The build JDK stays on Java 21 LTS.
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
