# nfpm configuration for the .deb and .rpm of one Linux target. dist.xml
# replaces each @TOKEN@ and runs nfpm once per packager.
name: qcaret
arch: "@ARCH@"
platform: linux
version: "@VERSION@"
version_schema: none
release: "1"
section: editors
priority: optional
maintainer: Adam Dailey <31244497+ajdailey@users.noreply.github.com>
vendor: QCaret
homepage: https://github.com/ajdailey/qcaret
license: Apache-2.0
description: |-
  Programmer's text editor
  QCaret is a cross-platform programmer's text editor with syntax
  highlighting, search and replace across files, and file compare.
mtime: "@MTIME@"
umask: 0o022
overrides:
  deb:
    depends:
      - libgtk-3-0t64 | libgtk-3-0
  rpm:
    depends:
      - gtk3
deb:
  compression: xz
rpm:
  compression: xz
  buildhost: localhost
  group: Applications/Editors
contents:
  - src: "@HOME@"
    dst: /opt/qcaret
    type: tree
  - src: /opt/qcaret/bin/qcaret
    dst: /usr/bin/qcaret
    type: symlink
  - src: "@SRC@/qcaret.desktop"
    dst: /usr/share/applications/qcaret.desktop
  - src: "@ICONS@/qcaret.svg"
    dst: /usr/share/icons/hicolor/scalable/apps/qcaret.svg
  - src: "@ART@/hicolor/16x16/apps/qcaret.png"
    dst: /usr/share/icons/hicolor/16x16/apps/qcaret.png
  - src: "@ART@/hicolor/22x22/apps/qcaret.png"
    dst: /usr/share/icons/hicolor/22x22/apps/qcaret.png
  - src: "@ART@/hicolor/24x24/apps/qcaret.png"
    dst: /usr/share/icons/hicolor/24x24/apps/qcaret.png
  - src: "@ART@/hicolor/32x32/apps/qcaret.png"
    dst: /usr/share/icons/hicolor/32x32/apps/qcaret.png
  - src: "@ART@/hicolor/48x48/apps/qcaret.png"
    dst: /usr/share/icons/hicolor/48x48/apps/qcaret.png
  - src: "@ART@/hicolor/64x64/apps/qcaret.png"
    dst: /usr/share/icons/hicolor/64x64/apps/qcaret.png
  - src: "@ART@/hicolor/128x128/apps/qcaret.png"
    dst: /usr/share/icons/hicolor/128x128/apps/qcaret.png
  - src: "@ART@/hicolor/256x256/apps/qcaret.png"
    dst: /usr/share/icons/hicolor/256x256/apps/qcaret.png
  - src: "@ART@/hicolor/512x512/apps/qcaret.png"
    dst: /usr/share/icons/hicolor/512x512/apps/qcaret.png
